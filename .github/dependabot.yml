version: 2
updates:
  # Open a PR when a new Caddy image is released; merging it rebuilds the image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Skip Dependabot's default 3-day cooldown for the official Caddy image
    cooldown:
      exclude: ['caddy']
    groups:
      caddy:
        patterns: ['caddy']
